<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050607">
  <title>Jarvis OS — Reconnecting</title>
  <style>
    html,body{min-height:100%;margin:0;background:#050607;color:#eef3f8;font-family:ui-monospace,monospace}
    main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
    small{color:#6f7d8b;letter-spacing:.14em}
    h1{font:500 clamp(40px,8vw,96px)/.9 Arial,sans-serif;letter-spacing:-.06em;margin:18px 0}
    a{color:#bdd5ff;text-decoration:none;border:1px solid #284264;padding:10px 12px;display:inline-block}
    a:focus-visible{outline:2px solid #bdd5ff;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <div>
      <small>JARVIS / ROUTE NOT FOUND</small>
      <h1>CONTEXT LOST.<br>RETURN TO CORE.</h1>
      <a id="return-home" href="./">ENTER JARVIS ↗</a>
    </div>
  </main>
  <script>
    // A nested unknown URL must not make the return link point to another unknown URL.
    // GitHub Pages project sites live under /Jarvis-OS-Website/; custom domains use /.
    const repositoryRoot = "/Jarvis-OS-Website/";
    const onProjectPages = location.hostname.endsWith(".github.io")
      && (location.pathname === "/Jarvis-OS-Website" || location.pathname.startsWith(repositoryRoot));
    document.getElementById("return-home").setAttribute("href", onProjectPages ? repositoryRoot : "/");
  </script>
</body>
</html>
